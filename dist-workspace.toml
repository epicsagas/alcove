[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
cargo-dist-version = "0.31.0"
ci = "github"
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
installers = ["homebrew", "shell", "powershell"]
tap = "epicsagas/homebrew-tap"
create-release = true
features = ["full-cross"]
features-aarch64-apple-darwin = ["full-macos"]
features-aarch64-unknown-linux-gnu = ["full-cross"]
features-x86_64-unknown-linux-gnu = ["full-cross"]
features-x86_64-pc-windows-msvc = ["full-cross"]
install-path = "CARGO_HOME"
install-updater = false
publish-jobs = ["homebrew", "./publish-crates"]
allow-dirty = ["ci"]
macos-sign = false

[dist.dependencies.apt]
libopenblas-dev = "*"

# Pin the native Apple Silicon build to macos-14. The rolling macos-latest
# image intermittently ships a broken compiler-rt path, breaking the
# ort/fastembed static link ("ld: library 'clang_rt.osx' not found") for the
# full-macos aarch64-apple-darwin artifact. macos-14 has a stable Xcode/clang
# toolchain. Revisit once ort's prebuilt static archive tracks the newer clang
# runtime path.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-14"
