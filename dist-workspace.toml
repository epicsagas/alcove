[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
cargo-dist-version = "0.31.0"
ci = "github"
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]
installers = ["homebrew", "shell"]
tap = "epicsagas/homebrew-tap"
create-release = true
features = ["full-cross"]
features-aarch64-apple-darwin = ["full-macos"]
features-x86_64-unknown-linux-gnu = ["full-cross"]
install-path = "CARGO_HOME"
install-updater = false
publish-jobs = ["homebrew", "./publish-crates"]
allow-dirty = ["ci"]
macos-sign = false
# Inject clang_rt.osx link-path setup before `dist build` so the macOS
# aarch64-apple-darwin artifact links under the Xcode 16.4 image. See
# .github/dist/build-setup.yml.
github-build-setup = "../dist/build-setup.yml"

[dist.dependencies.apt]
libopenblas-dev = "*"

# Pin the native Apple Silicon build to macos-14. The rolling macos-latest
# image intermittently ships a broken compiler-rt path, breaking the
# ort/fastembed static link ("ld: library 'clang_rt.osx' not found") for the
# full-macos aarch64-apple-darwin artifact. macos-14 has a stable Xcode/clang
# toolchain. Revisit once ort's prebuilt static archive tracks the newer clang
# runtime path.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-14"
# Linux builds on ubuntu-24.04 (glibc 2.39): llm-kernel >= 0.12 statically
# links ort, whose archive references glibc 2.38+ symbols. The 22.04 image
# (glibc 2.35) fails the release link with `undefined symbol: __isoc23_strtoll`.
# Trade-off: the produced binaries require glibc >= 2.38 at runtime.
x86_64-unknown-linux-gnu = "ubuntu-24.04"
