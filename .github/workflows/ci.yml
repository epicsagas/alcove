name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CI: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenBLAS (required by TurboQuant/turbovec)
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Check
        run: cargo check --locked --all-targets --features full-cross
      - name: Clippy
        run: cargo clippy --locked --features full-cross -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check

  cross-check-linux:
    name: Cross-Platform Check (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenBLAS (required by TurboQuant/turbovec)
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Check (x86_64-unknown-linux-gnu)
        run: cargo check --locked --target x86_64-unknown-linux-gnu --features full-cross

  cross-check-aarch64:
    name: Cross-Platform Check (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install aarch64 cross-compilation tools
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Check (aarch64-unknown-linux-gnu)
        run: cargo check --locked --target aarch64-unknown-linux-gnu --features full-cross

  cross-check-windows:
    name: Cross-Platform Check (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Check (x86_64-pc-windows-msvc)
        run: cargo check --locked --target x86_64-pc-windows-msvc --features full-cross

  cross-check-directml:
    name: Cross-Platform Check (DirectML, x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Check (x86_64-pc-windows-msvc + embed-directml)
        run: cargo check --locked --target x86_64-pc-windows-msvc --features embed-directml,vector

  test:
    name: Test
    # Pinned to macos-14 to dodge rolling-image compiler-rt regressions, AND
    # works around a clang_rt link failure present on the Xcode 16.4 image
    # (both macos-latest and macos-14): ort-sys emits `-lclang_rt.osx` plus a
    # `-L .../clang/17/lib/darwin` search path that does not exist on this
    # toolchain, so `ld: library 'clang_rt.osx' not found` aborts the link of
    # the full-macos test binary. The step below locates the real
    # libclang_rt.osx.a and exposes its directory as a link path. Revisit once
    # ort's prebuilt static archive tracks the newer clang runtime path.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Persist fastembed/ort ONNX Runtime downloads so a transient
          # re-fetch doesn't break native linking on cache misses.
          cache-directories: ~/Library/Caches/ort.pyke.io
      - name: Locate clang_rt.osx (Xcode 16.4 link-path workaround)
        run: |
          set -e
          RT="$(find /Applications/Xcode*.app -name 'libclang_rt.osx.a' -print -quit 2>/dev/null)"
          if [ -z "$RT" ]; then
            echo "::error::libclang_rt.osx.a not found under /Applications/Xcode*.app"
            exit 1
          fi
          echo "Found clang_rt at: $RT"
          echo "CLANG_RT_DIR=$(dirname "$RT")" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --locked --features full-macos -- --test-threads=1
        env:
          RUSTFLAGS: "-L${{ env.CLANG_RT_DIR }}"

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenBLAS (required by TurboQuant/turbovec)
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Test
        run: cargo test --locked --features full-cross -- --test-threads=1

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate SBOM
        run: cargo cyclonedx -f json --features full-cross
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: "*.cdx.json"

  # Release-link gate: `cargo check` does not link, so a static-link
  # regression (e.g. ort's static archive requiring glibc 2.38+ / MSVC CRT
  # symbols) only surfaces at `cargo build --release`. Run that here on the
  # exact runner images the dist release uses, so a link failure fails the PR
  # instead of the tagged release run.
  release-build-linux:
    name: Release build (Linux, static ort link)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenBLAS (required by TurboQuant/turbovec)
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Release build
        run: cargo build --release --locked --features full-cross

  release-build-windows:
    name: Release build (Windows, static ort link)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Release build
        run: cargo build --release --locked --features full-cross
